# Runs only when YOU push a version tag. Uploads CI artifacts — does not publish to a store.
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: pnpm run build:core
      - run: pnpm --filter @context-translate/extension build
      - uses: actions/upload-artifact@v4
        with:
          name: chrome-extension
          path: apps/extension/.output/

  build-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install
      - run: pnpm run build:core
      - run: pnpm --filter @context-translate/desktop build:desktop
      - uses: actions/upload-artifact@v4
        with:
          name: windows-desktop
          path: apps/desktop/src-tauri/target/release/bundle/
