<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Context Translate</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app" class="hidden">
      <header>
        <h1>Context Translate</h1>
        <button id="close-btn" type="button" aria-label="Close">×</button>
      </header>
      <p id="error" class="error hidden"></p>
      <p id="translation" class="translation"></p>
      <p id="original" class="original"></p>
      <button id="copy-btn" type="button">Copy translation</button>
    </div>

    <div id="settings-panel" class="settings hidden">
      <h2>Settings</h2>
      <p class="hint">Default <strong>Demo</strong> mode works without an API key.</p>

      <label>
        Translation mode
        <select id="translate-mode">
          <option value="mock">Demo (offline, safe)</option>
          <option value="google">Google Translate (your API key)</option>
        </select>
      </label>

      <label>
        Google Cloud Translation API key
        <input id="google-api-key" type="password" placeholder="Only for Google mode" autocomplete="off" />
      </label>

      <label>
        Translate into
        <select id="target-language"></select>
      </label>

      <button id="save-settings" type="button">Save</button>
      <p id="settings-status" class="ok hidden">Saved</p>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
